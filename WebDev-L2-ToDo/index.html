<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div>
                <p class="eyebrow">PERSONAL PRODUCTIVITY</p>
                <h1>Focus<span>Flow</span></h1>
            </div>

            <button id="themeBtn" class="theme-btn">☀</button>
        </header>

        <main>

            <section class="hero">
                <div>
                    <p id="date"></p>
                    <h2>Make today<br><span>count.</span></h2>
                    <p class="subtitle">
                        Organize your tasks. Clear your mind.
                    </p>
                </div>

                <div class="progress-card">
                    <div class="progress-ring">
                        <strong id="progressPercent">0%</strong>
                    </div>
                    <div>
                        <small>Today's progress</small>
                        <p><b id="completedCount">0</b> of <b id="totalCount">0</b> completed</p>
                    </div>
                </div>
            </section>

            <section class="task-box">

                <div class="input-area">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What needs to be done?"
                    >
                    <button id="addBtn">＋ Add Task</button>
                </div>

                <div class="filters">
                    <button class="filter active" data-filter="all">All</button>
                    <button class="filter" data-filter="active">Active</button>
                    <button class="filter" data-filter="completed">Completed</button>
                </div>

                <div id="taskList"></div>

                <div id="emptyState" class="empty">
                    <div>✦</div>
                    <h3>Nothing here yet</h3>
                    <p>Add a task and start making progress.</p>
                </div>

                <div class="bottom-bar">
                    <span id="remaining">0 tasks remaining</span>
                    <button id="clearCompleted">Clear completed</button>
                </div>

            </section>

        </main>

        <footer>
            <p>FOCUSFLOW</p>
            <span>Built with HTML • CSS • JavaScript</span>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
